name: Build Debian package

on:
  push:
    branches: ['**']
    tags: ['**', '!latest-build']

permissions:
  contents: read

env:
  MISE_DISABLE_TOOLS: pipx:meson,aqua:ninja-build/ninja,python

jobs:
  build:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: miuutil-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2025.8.13
          install: false
          cache: false
      - name: Build and test the exact commit
        id: package
        run: mise exec -- bash dev/build-package.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: debian-package
          path: ${{ steps.package.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: miuutil-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2025.8.13
          install: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: debian-package
          path: dist/publish
      - name: Install the release client
        run: mise install aqua:cli/cli
      - name: Publish the release package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: mise exec -- bash dev/publish-package.sh dist/publish
